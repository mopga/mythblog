# Mount Oddity Archive at https://HOST/oddity/ while the Go app listens on 127.0.0.1:8890.
location = /oddity {
    return 301 /oddity/;
}

location /oddity/ {
    client_max_body_size 11m;
    rewrite ^/oddity/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8890;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /oddity;
    proxy_redirect ~^/(.*)$ /oddity/$1;

    # Templates use root-relative URLs. Rewrite only URL-bearing HTML attributes.
    sub_filter_once off;
    sub_filter 'href="/' 'href="/oddity/';
    sub_filter 'src="/' 'src="/oddity/';
    sub_filter 'action="/' 'action="/oddity/';
}
